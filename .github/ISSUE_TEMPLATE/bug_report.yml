name: 🐞 Bug report
description: Create a report to help us improve
labels: ["bug"]
body:
  - type: checkboxes
    id: support-channel
    attributes:
      label: Before you continue
      options:
        - label: >
            I understand that if I am a JFrog customer with access to the Salesforce Support Portal
            or a support contact, I should log this there instead for faster visibility and
            prioritization. (This repository's GitHub issues are actively monitored for the
            open-source community and contributions.)
          required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
  - type: input
    id: client-version
    attributes:
      label: Artifactory Java Client version
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: input
    id: artifactory-version
    attributes:
      label: Artifactory Version
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
