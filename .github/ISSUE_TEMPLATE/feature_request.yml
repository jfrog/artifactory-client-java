name: ⭐️ Feature request
description: Suggest an idea for this project
labels: ["feature request"]
body:
  - type: checkboxes
    id: support-channel
    attributes:
      label: Before you continue
      options:
        - label: >
            I understand that if I am a JFrog customer with access to the Salesforce Support Portal
            or a support contact, I should log this there instead for faster visibility and
            prioritization. (This repository's GitHub issues are actively monitored for the
            open-source community and contributions.)
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like to see
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
